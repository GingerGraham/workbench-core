# Default contents of ~/.config/workbench/core/version, written once on
# first `wb install` if that file does not already exist. Plain KEY=VALUE —
# readable via `source` or `grep` without needing awk or any core library
# loaded (ARCHITECTURE.md §6). See contracts/core-api.md for what each
# version value actually gates.
#
# CORE_API_VERSION is X.Y, not a bare integer (ARCHITECTURE.md §12 D29):
# bump the minor segment when adding anything to contracts/core-api.md's
# documented surface; bump major and reset minor to 0 for anything removed
# or behaviourally changed there.
CORE_API_VERSION=1.1
MANIFEST_SCHEMA_VERSION=1
STATE_SCHEMA_VERSION=2
WORKBENCH_CORE_SEMVER=0.1.0
