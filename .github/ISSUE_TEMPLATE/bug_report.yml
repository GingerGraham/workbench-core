name: Bug report
description: Report unexpected behaviour in workbench-core
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. `docs/troubleshooting.md`
        covers the common prereq/loader/sync/SSH issues — worth a quick
        check before filing.
  - type: input
    id: version
    attributes:
      label: workbench-core version
      description: Output of `wb version`
      placeholder: "v1.1.1"
    validations:
      required: true
  - type: dropdown
    id: os-family
    attributes:
      label: Operating system
      description: The OS you ran it on. For WSL2 or a container, pick the distro running inside it.
      options:
        - Fedora / RHEL family (Fedora, RHEL, CentOS Stream, Rocky, Alma)
        - Debian / Ubuntu family (Debian, Ubuntu, Linux Mint, Pop!_OS)
        - Arch family (Arch, Manjaro, EndeavourOS, CachyOS)
        - SUSE family (openSUSE Tumbleweed or Leap, SLE)
        - Other Linux
        - macOS
    validations:
      required: true
  - type: input
    id: distro-version
    attributes:
      label: Distribution and version
      description: Exact distro and release, e.g. from `/etc/os-release` (`PRETTY_NAME`) or `sw_vers` on macOS.
      placeholder: "Fedora Linux 43 (Workstation Edition)"
    validations:
      required: false
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Where it was running.
      options:
        - Directly on the OS (physical machine or VM)
        - Container
        - WSL2
      default: 0
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected to happen too, if it's not obvious.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Re-run with `WORKBENCH_DEBUG=true` if you can, and paste the relevant portion. This renders as a code block automatically.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I checked docs/troubleshooting.md first
          required: true
