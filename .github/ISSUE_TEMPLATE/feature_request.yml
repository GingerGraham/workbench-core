name: Feature request
description: Propose new behaviour or a change to existing behaviour
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What can't you do today, or what's awkward?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Core API (bin/wb, lib/core)
        - Manifest / sync engine
        - CLI (wb subcommands)
        - Module authoring / contracts
        - Docs
        - CI / release automation
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I checked ARCHITECTURE.md §12 — this isn't already a settled (or deliberately rejected) decision
          required: true
