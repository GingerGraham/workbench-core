name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

jobs:
  lint:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run shellcheck
        run: |
          shopt -s globstar
          shellcheck bin/wb bootstrap.sh lib/**/*.sh tests/*.sh .github/scripts/**/*.sh

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve ref under test
        id: ref
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_REPO_OWNER: ${{ github.event.pull_request.head.repo.owner.login }}
          HEAD_REPO_NAME: ${{ github.event.pull_request.head.repo.name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            {
              echo "branch=${HEAD_REF}"
              echo "owner=${HEAD_REPO_OWNER}"
              echo "repo=${HEAD_REPO_NAME}"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "branch=${REF_NAME}"
              echo "owner=${REPOSITORY%%/*}"
              echo "repo=${REPOSITORY##*/}"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Run test suite
        env:
          WORKBENCH_TEST_GH_BRANCH: ${{ steps.ref.outputs.branch }}
          WORKBENCH_TEST_GH_OWNER: ${{ steps.ref.outputs.owner }}
          WORKBENCH_TEST_GH_REPO: ${{ steps.ref.outputs.repo }}
        run: .github/scripts/ci/run-tests.sh | tee test-output.log
        shell: bash

      # macOS's stock /bin/bash is 3.2, the floor AGENTS.md sets for bin/,
      # lib/, bootstrap.sh and tests/. The runner's PATH normally finds
      # Homebrew's bash 5 first, and every suite and bin/wb start through
      # `#!/usr/bin/env bash`, so put a directory holding bash -> /bin/bash
      # first on PATH for this step.
      - name: Run test suite under /bin/bash (3.2)
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        env:
          WORKBENCH_TEST_GH_BRANCH: ${{ steps.ref.outputs.branch }}
          WORKBENCH_TEST_GH_OWNER: ${{ steps.ref.outputs.owner }}
          WORKBENCH_TEST_GH_REPO: ${{ steps.ref.outputs.repo }}
        run: |
          bash32_dir="$(mktemp -d)"
          ln -s /bin/bash "${bash32_dir}/bash"
          export PATH="${bash32_dir}:${PATH}"
          bash --version
          .github/scripts/ci/run-tests.sh | tee test-output-bash32.log
        shell: bash

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-output-${{ matrix.os }}
          path: test-output*.log
          if-no-files-found: warn

  secrets-scan:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/scan-secrets

  malware-scan:
    name: malware (clamav)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/scan-malware

  pattern-scan:
    name: dangerous patterns
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/scan-patterns
