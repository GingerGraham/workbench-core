name: Release Finalize

on:
  pull_request:
    types: [closed]
    branches: [main]

# Only a merged release/vX.Y.Z PR triggers finalization — every other
# closed PR against main (merged or not) is ignored here.
jobs:
  finalize:
    if: |
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    steps:
      - name: Mint release App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout merge commit
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 1

      - name: Read release version
        id: version
        run: echo "version=$(head -n 1 VERSION)" >> "$GITHUB_OUTPUT"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Tag release commit
        env:
          NEW_VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag -a "v${NEW_VERSION}" -m "v${NEW_VERSION}"
          git push origin "v${NEW_VERSION}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NEW_VERSION: ${{ steps.version.outputs.version }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "${PR_BODY}" > release-notes.md
          gh release create "v${NEW_VERSION}" --title "v${NEW_VERSION}" --notes-file release-notes.md
