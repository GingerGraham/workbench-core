name: Module Release

# Reusable workflow (docs/decisions-log.md D40) called by each module repo's
# thin .github/workflows/release.yml. Same propose-PR-then-finalize shape
# as core's own release.yml/release-finalize.yml (D27/D28) -- main's
# branch ruleset requires a PR, so a direct-push bump is equally
# unworkable on the module repos -- but repo-level version/tag only, no
# per-file script-local bump (module repos carry no
# _workbench_register_script_version surface).
on:
  workflow_call:
    inputs:
      core_ref:
        description: "workbench-core ref to pull the shared release scripts from. Empty (default) resolves to core's latest published GitHub Release tag."
        required: false
        type: string
        default: ""
      bump_type:
        description: "Force a release at this minimum semver severity (patch/minor/major), regardless of what Conventional Commits since the last tag would compute. Empty (default) leaves severity fully commit-driven. See docs/decisions-log.md D67."
        required: false
        type: string
        default: ""
      reason:
        description: "Optional human note for why this release is being forced manually, appended to the release PR notes only — never the PR title or commit headline."
        required: false
        type: string
        default: ""
    secrets:
      RELEASE_APP_PRIVATE_KEY:
        description: "Private key for the release GitHub App (RELEASE_APP_ID var + this secret, same App as core's own release pipeline, D28)."
        required: true

# Caller permissions required: contents: read. Every write (release-branch
# commit, PR creation, auto-merge) uses the minted App token below, scoped
# to exactly contents: write + pull-requests: write at the point it's
# minted — never the default GITHUB_TOKEN.
#
# The scripts this workflow runs come from workbench-core at core_ref
# (latest release by default), so they are not code this repo reviewed. The
# job is ordered so they never meet the write token (D119, N4):
#   1. checkouts use the read-only default token and keep no credentials;
#   2. the core scripts run next, with no App token minted yet;
#   3. a step with no token checks the scripts changed CHANGELOG.md and
#      nothing else;
#   4. only then is the App token minted, and the steps that hold it run
#      GitHub API calls through github-script — no git, gh or core script
#      runs while it exists, and only CHANGELOG.md is committed.
permissions:
  contents: read

concurrency:
  group: module-release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-core-ref:
    name: resolve core_ref
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - name: "Resolve core_ref (default: workbench-core's latest published release)"
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_CORE_REF: ${{ inputs.core_ref }}
        run: |
          if [[ -n "${INPUT_CORE_REF}" ]]; then
            echo "ref=${INPUT_CORE_REF}" >> "$GITHUB_OUTPUT"
          else
            tag="$(gh api repos/GingerGraham/workbench-core/releases/latest --jq .tag_name)"
            echo "ref=${tag}" >> "$GITHUB_OUTPUT"
          fi

  propose:
    name: propose release
    needs: resolve-core-ref
    # Never let the release PR's own squash-merge commit re-trigger this
    # workflow's bump computation against itself.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    steps:
      # Read-only default token, and no credentials left in .git/config: the
      # core scripts below run in this workspace and must not find a write
      # token here (D119).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Checkout workbench-core@${{ needs.resolve-core-ref.outputs.ref }} (for the shared release scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: GingerGraham/workbench-core
          ref: ${{ needs.resolve-core-ref.outputs.ref }}
          path: _core
          persist-credentials: false

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Compute bump
        id: compute
        env:
          WB_RELEASE_FORCE_SEVERITY: ${{ inputs.bump_type }}
        run: |
          overall_line="$(_core/.github/scripts/module-release/compute-bump.sh | tee bump-plan.txt)"
          IFS='|' read -r _ old_version new_version severity reason <<< "${overall_line}"
          echo "old_version=${old_version}" >> "$GITHUB_OUTPUT"
          echo "new_version=${new_version}" >> "$GITHUB_OUTPUT"
          echo "severity=${severity}" >> "$GITHUB_OUTPUT"
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"

      - name: Apply bump (CHANGELOG.md only)
        if: steps.compute.outputs.severity != 'none'
        env:
          WB_RELEASE_MANUAL_REASON: ${{ inputs.reason }}
        run: _core/.github/scripts/module-release/apply-bump.sh "$(cat bump-plan.txt)"

      - name: Build release notes
        if: steps.compute.outputs.severity != 'none'
        env:
          OLD_VERSION: ${{ steps.compute.outputs.old_version }}
          NEW_VERSION: ${{ steps.compute.outputs.new_version }}
          SEVERITY: ${{ steps.compute.outputs.severity }}
          MANUAL_REASON: ${{ inputs.reason }}
        run: |
          {
            echo "**Version:** ${OLD_VERSION} -> ${NEW_VERSION} (${SEVERITY})"
            if [[ -n "${MANUAL_REASON}" ]]; then
              echo
              echo "**Manual release note:** ${MANUAL_REASON}"
            fi
            echo
            echo "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md) for the human-readable detail -- this PR's diff includes the heading rename."
          } > release-notes.md

      # The last step that runs git, and it holds no token. apply-bump.sh
      # only rewrites CHANGELOG.md, so anything else changed means a core
      # script did something it should not have -- stop before a token
      # exists (D119).
      - name: Check the release changes only CHANGELOG.md
        id: verify
        if: steps.compute.outputs.severity != 'none'
        run: |
          changed="$(git diff --name-only HEAD)"
          if [[ "${changed}" != "CHANGELOG.md" ]]; then
            echo "::error::A release may change only CHANGELOG.md, but these tracked files changed:"
            echo "${changed:-<none>}"
            exit 1
          fi
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Minted only now, after every core script has finished.
      - name: Mint release App token
        id: app-token
        if: steps.compute.outputs.severity != 'none'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # main requires verified commit signatures -- a plain `git commit` is
      # never signed regardless of which token pushes it, so the release
      # commit is created via the createCommitOnBranch GraphQL mutation
      # instead, exactly like core's own release.yml (D27). It commits
      # CHANGELOG.md alone, read straight from disk: no git runs here.
      - name: Create release branch and commit via API (verified signature)
        if: steps.compute.outputs.severity != 'none'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          NEW_VERSION: ${{ steps.compute.outputs.new_version }}
          BASE_SHA: ${{ steps.verify.outputs.base_sha }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');

            const newVersion = process.env.NEW_VERSION;
            const branchName = `release/v${newVersion}`;
            const baseSha = process.env.BASE_SHA;

            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/heads/${branchName}`,
                sha: baseSha,
              });
            } catch (err) {
              if (err.status === 422 && /already exists/i.test(err.message)) {
                core.info(`refs/heads/${branchName} already exists (stale from a previous run) -- resetting it to ${baseSha}`);
                await github.rest.git.updateRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${branchName}`,
                  sha: baseSha,
                  force: true,
                });
              } else {
                throw err;
              }
            }

            const additions = [{
              path: 'CHANGELOG.md',
              contents: fs.readFileSync('CHANGELOG.md').toString('base64'),
            }];

            const mutation = `
              mutation ($input: CreateCommitOnBranchInput!) {
                createCommitOnBranch(input: $input) {
                  commit { oid }
                }
              }
            `;

            await github.graphql(mutation, {
              input: {
                branch: {
                  repositoryNameWithOwner: `${context.repo.owner}/${context.repo.repo}`,
                  branchName,
                },
                message: { headline: `chore(release): v${newVersion}` },
                fileChanges: { additions },
                expectedHeadOid: baseSha,
              },
            });

      # Through the API rather than the gh CLI: gh runs git in the
      # workspace, and the workspace is where the core scripts ran.
      - name: Open release PR and enable auto-merge
        if: steps.compute.outputs.severity != 'none'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          NEW_VERSION: ${{ steps.compute.outputs.new_version }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');
            const newVersion = process.env.NEW_VERSION;

            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: 'main',
              head: `release/v${newVersion}`,
              title: `chore(release): v${newVersion}`,
              body: fs.readFileSync('release-notes.md', 'utf8'),
            });

            await github.graphql(`
              mutation ($id: ID!) {
                enablePullRequestAutoMerge(input: { pullRequestId: $id, mergeMethod: SQUASH }) {
                  clientMutationId
                }
              }
            `, { id: pr.node_id });
