name: Module Release Finalize

# Reusable workflow (ARCHITECTURE.md S12 D40) called by each module repo's
# thin .github/workflows/release-finalize.yml. Triggered when a
# release/vX.Y.Z PR merges; tags the merge commit and publishes the
# GitHub Release. Module repos carry no VERSION file (repo-level-only
# versioning, D40) -- the version is read back from the release branch's
# own name (release/v<version>) rather than a file in the tree.
on:
  workflow_call: {}

jobs:
  finalize:
    if: |
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    steps:
      - name: Mint release App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout merge commit
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 1

      - name: Read release version from branch name
        id: version
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: echo "version=${HEAD_REF#release/v}" >> "$GITHUB_OUTPUT"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Tag release commit
        env:
          NEW_VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag -a "v${NEW_VERSION}" -m "v${NEW_VERSION}"
          git push origin "v${NEW_VERSION}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NEW_VERSION: ${{ steps.version.outputs.version }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "${PR_BODY}" > release-notes.md
          gh release create "v${NEW_VERSION}" --title "v${NEW_VERSION}" --notes-file release-notes.md
